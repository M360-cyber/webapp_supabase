{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">All Orders</h3>
<table class="table table-bordered bg-white shadow-sm">
  <thead class="table-primary">
    <tr><th>Order ID</th><th>Item Name</th><th>Price</th><th>Placed By</th></tr>
  </thead>
  <tbody>
    {% for order in orders %}
    <tr>
      <td>#{{ order.id }}</td>
      <td>{{ order.item_name }}</td>
      <td>${{ "%.2f"|format(order.price) }}</td>
      <td>{{ order.user.name }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
