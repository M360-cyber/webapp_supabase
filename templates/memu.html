{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Store Menu</h3>
<div class="row">
  {% for item in items %}
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ item.name }}</h5>
        <p class="card-text text-muted">${{ "%.2f"|format(item.price) }}</p>
        <button class="btn btn-sm btn-outline-primary">Order Item</button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
