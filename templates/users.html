{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">All Users Dashboard</h3>
<table class="table table-striped border bg-white shadow-sm">
  <thead class="table-dark">
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td><span class="badge bg-secondary">{{ user.role }}</span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
